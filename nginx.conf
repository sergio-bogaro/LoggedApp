server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads do backend: mesmo limite validado na API (10 MB).
    client_max_body_size 10M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Cabeçalhos repassados ao backend (herdados por todos os proxy_pass abaixo).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ──────────────────────────────────────────────
    # Proxy reverso para a API (serviço `api` da mesma rede Docker).
    # Sem barra no final do proxy_pass o caminho é preservado:
    #   /api/media  →  http://api:8000/api/media
    # Isso deixa o app inteiro na mesma origem (porta 5173), sem CORS.
    # Os prefixos não colidem com as rotas do SPA (react-router).
    # ──────────────────────────────────────────────
    location /api/          { proxy_pass http://api:8000; }
    location /auth/         { proxy_pass http://api:8000; }
    location /uploads/      { proxy_pass http://api:8000; }
    location /custom-views/ { proxy_pass http://api:8000; }
    location /docs          { proxy_pass http://api:8000; }
    location /openapi.json  { proxy_pass http://api:8000; }

    # Assets com hash do Vite: cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca deve ser cacheado.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (react-router): qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
