server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads do backend: mesmo limite validado na API (10 MB).
    client_max_body_size 10M;

    # Re-resolve o nome do serviço da API no DNS interno do Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Cabeçalhos repassados ao backend (herdados por todos os proxy_pass abaixo).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ──────────────────────────────────────────────
    # Proxy reverso para a API (serviço `api` da mesma rede Docker).
    # Sem barra no final do proxy_pass o caminho é preservado:
    #   /api/media  →  http://api:8000/api/media
    # Isso deixa o app inteiro na mesma origem (porta 5173), sem CORS.
    # Os prefixos não colidem com as rotas do SPA (react-router).
    # ──────────────────────────────────────────────
    location /api/          { proxy_pass http://$api_upstream; }
    location /auth/         { proxy_pass http://$api_upstream; }
    location /uploads/      { proxy_pass http://$api_upstream; }
    location /docs          { proxy_pass http://$api_upstream; }
    location /redoc         { proxy_pass http://$api_upstream; }
    location /openapi.json  { proxy_pass http://$api_upstream; }
    location = /health      { proxy_pass http://$api_upstream; }

    # Importações podem ter arquivos maiores e demorar mais que o padrão.
    location /api/import/ {
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://$api_upstream;
    }

    # Assets com hash do Vite: cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # O index.html nunca deve ser cacheado.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA fallback (react-router): qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
