<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Logged — track the movies, series, anime, manga, games and books you consume." />
    <meta name="theme-color" content="#18221d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Logged</title>
    <script>
      (function () {
        try {
          var themes = ["light", "dark", "rose-pine", "rose-pine-dawn", "green-light", "green-dark"];
          var stored = localStorage.getItem("theme");
          var theme = themes.indexOf(stored) !== -1 ? stored : "light";
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
