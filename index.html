<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Logged — track the movies, series, anime, manga, games and books you consume." />
    <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)" />
    <title>Logged</title>
    <script>
      (function () {
        try {
          var themes = {
            "light": "light",
            "dark": "dark",
            "purple-light": "light purple",
            "purple-dark": "dark purple",
            "green-light": "light green",
            "green-dark": "dark green"
          };
          var stored = localStorage.getItem("theme");
          var classes = themes[stored] || "light";
          classes.split(" ").forEach(function (value) {
            document.documentElement.classList.add(value);
          });
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
