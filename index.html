<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Logged: um registro pessoal de filmes, séries, animes, mangás, livros, jogos e música."
    />
    <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)" />
    <title>Logged</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "light";
          var mode = stored.indexOf("dark") !== -1 ? "dark" : "light";
          var palette = stored.indexOf("purple") !== -1
            ? " purple"
            : stored.indexOf("green") !== -1
              ? " green"
              : "";

          document.documentElement.className = mode + palette;
        } catch (e) {
          document.documentElement.className = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
